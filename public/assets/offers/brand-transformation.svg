<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <!-- Fond papier chaud épuré -->
  <rect width="480" height="320" fill="#faf9f5"/>

  <!-- Composition géométrique minimale : Deux cercles en convergence & accent solaire -->
  <g transform="translate(240, 160)">
    <!-- Cercle gauche (Stratégie) -->
    <circle cx="-42" cy="0" r="65" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
    <!-- Cercle droit (Création) -->
    <circle cx="42" cy="0" r="65" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
    <!-- Disque solaire à l'intersection centrale -->
    <circle cx="0" cy="0" r="20" fill="#ffff4a" stroke="#0a0a0a" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#0a0a0a"/>
    <!-- Axe vertical fin -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#0a0a0a" stroke-width="0.8"/>
  </g>
</svg>
