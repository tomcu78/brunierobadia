<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <!-- Fond papier chaud épuré -->
  <rect width="480" height="320" fill="#faf9f5"/>

  <!-- Composition géométrique minimale : Filaires modulaires & vecteur dynamique -->
  <g transform="translate(240, 160)">
    <!-- Base filaire isométrique -->
    <polygon points="0,-45 45,-20 45,30 0,55 -45,30 -45,-20" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
    <line x1="0" y1="55" x2="0" y2="5" stroke="#0a0a0a" stroke-width="1.2"/>
    <line x1="-45" y1="-20" x2="0" y2="5" stroke="#0a0a0a" stroke-width="1.2"/>
    <line x1="45" y1="-20" x2="0" y2="5" stroke="#0a0a0a" stroke-width="1.2"/>

    <!-- Ligne de projection dynamique -->
    <line x1="-120" y1="50" x2="120" y2="-50" stroke="#0a0a0a" stroke-width="1"/>
    
    <!-- Accent solaire jaune -->
    <circle cx="60" cy="-25" r="14" fill="#ffff4a" stroke="#0a0a0a" stroke-width="1.2"/>
    <circle cx="-60" cy="25" r="3" fill="#0a0a0a"/>
  </g>
</svg>
