<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <!-- Fond papier chaud épuré -->
  <rect width="480" height="320" fill="#faf9f5"/>

  <!-- Composition géométrique minimale : Étoile à 4 branches & nœuds sémantiques -->
  <g transform="translate(240, 160)">
    <!-- Rayonnement fin / Croix équilibrée -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#0a0a0a" stroke-width="0.8"/>
    
    <!-- Cercle orbite discret -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#e0ded6" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Étoile centrale à 4 pointes élégante -->
    <path d="M 0,-40 Q 0,0 40,0 Q 0,0 0,40 Q 0,0 -40,0 Q 0,0 0,-40 Z" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
    
    <!-- Disque solaire jaune au cœur -->
    <circle cx="0" cy="0" r="14" fill="#ffff4a" stroke="#0a0a0a" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2.5" fill="#0a0a0a"/>

    <!-- Petits points satellites discrets -->
    <circle cx="50" cy="0" r="3" fill="#0a0a0a"/>
    <circle cx="-50" cy="0" r="3" fill="#0a0a0a"/>
  </g>
</svg>
